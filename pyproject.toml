[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-defect-vision"
version = "0.1.0"
description = "End-to-end Deep Learning project for industrial defect detection and semantic segmentation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
